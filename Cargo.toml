[workspace]
members = [
    "adapters/vellum-federation-vellum",
    "adapters/vellum-federation-configured-trust",
    "adapters/vellum-federation-replica-directory",
    "adapters/vellum-federation-rustls-transport",
    "ports/vellum-federation-edit-port",
    "ports/vellum-federation-replica-store-port",
    "ports/vellum-federation-transport-port",
    "ports/vellum-federation-trust-port",
    "protocol/vellum-federation-protocol",
    "protocol/vellum-federation-wire",
    "service/vellum-federation-replica",
    "service/vellum-federation-replica-durable",
    "service/vellum-federation-edit-admission",
    "service/vellum-federation-connection",
    "service/vellum-federation-session",
]
exclude = ["qualification/transport-session"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gantbd/vellum-federation"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
