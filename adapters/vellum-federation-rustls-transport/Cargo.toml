[package]
name = "vellum-federation-rustls-transport"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "TLS 1.3 physical transport for native Vellum federation"

[dependencies]
vellum-federation-protocol = { path = "../../protocol/vellum-federation-protocol", version = "=0.1.0" }
vellum-federation-transport-port = { path = "../../ports/vellum-federation-transport-port", version = "=0.1.0" }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
rustls-pki-types = { version = "=1.15.1", default-features = false, features = ["std"] }

[lints]
workspace = true
